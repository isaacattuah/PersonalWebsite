name: Verify site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files are current
        run: python3 scripts/build.py --check
      - name: Local links, assets and anchors resolve
        run: python3 scripts/check_links.py
